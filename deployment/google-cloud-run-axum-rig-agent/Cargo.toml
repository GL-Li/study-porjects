[package]
name = "axum-streaming"
version = "0.1.0"
edition = "2024"
publish = false

[lints.clippy]
all = "warn"

[dependencies]
rig = "0.43.0"
axum = "0.8"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "time", "sync", "fs"] }
futures = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
dotenvy = "0.15"
argon2 = "0.5"
jsonwebtoken = "9"
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
