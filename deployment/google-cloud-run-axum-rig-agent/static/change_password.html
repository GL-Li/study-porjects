<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f8fafc; }
  .card { width: 100%; max-width: 380px; background: #fff; padding: 28px; border-radius: 14px; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p.sub { margin: 0 0 20px; color: #64748b; font-size: 14px; }
  label { display: block; font-size: 13px; color: #334155; margin: 12px 0 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
  button { width: 100%; margin-top: 20px; padding: 11px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
  .error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
  .signout { margin-top: 16px; text-align: center; }
  .signout button { width: auto; background: none; color: #64748b; font-size: 13px; text-decoration: underline; padding: 0; }
</style>
</head>
<body>
<main class="card">
  <h1>Set a new password</h1>
  <p class="sub">You must change your temporary password before continuing.</p>
  <p id="error" class="error" hidden></p>
  <form method="post" action="/change-password">
    <label for="current_password">Temporary password</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required autofocus>
    <label for="new_password">New password (min 8 characters)</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Change password</button>
  </form>
  <form class="signout" method="post" action="/logout">
    <button type="submit">Sign out</button>
  </form>
</main>
<script>
  const messages = {
    short: 'New password must be at least 8 characters.',
    mismatch: 'The new passwords do not match.',
    current: 'The temporary password is incorrect.',
    storage: 'Server error. Please try again.'
  };
  const code = new URLSearchParams(location.search).get('error');
  if (code) {
    const el = document.getElementById('error');
    el.textContent = messages[code] || 'Could not change the password.';
    el.hidden = false;
  }
</script>
</body>
</html>
